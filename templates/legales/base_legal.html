<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Aviso Legal{% endblock %} - Consultorio Dental</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .legal-container { max-width: 900px; background: white; border-radius: 8px; padding: 2.5rem; }
        h1, h2 { color: #0369a1; }
    </style>
</head>
<body class="bg-light py-5">

    <div class="container legal-container shadow-sm">
        <h1 class="border-bottom pb-3 mb-4">{% block header %}{% endblock %}</h1>
        
        <div class="content text-secondary lh-lg">
            {% block content %}{% endblock %}
        </div>

        <hr class="my-4">
        
        <div class="d-flex justify-content-between align-items-center">
            <small class="text-muted">Última actualización: Agosto 2026</small>
            <a href="{{ url_for('index') }}" class="btn btn-sm btn-secondary">Volver al Inicio</a>
        </div>
    </div>

</body>
</html>

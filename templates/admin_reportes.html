<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes y Estadísticas - Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header class="navbar">
    <div class="logo-container">
        <img src="{{ url_for('static', filename='IMG/logoconsultorio.png') }}" class="logo">
        <h1>Módulo de Reportes</h1>
    </div>
    <nav>
        <a href="{{ url_for('admin') }}">⬅ Volver al Panel</a>
        <a href="/logout" class="btn-logout">Cerrar Sesión</a>
    </nav>
</header>

<main style="max-width:1100px; margin:40px auto; padding:20px;">

    <h2>📊 Resumen Estadístico</h2>

    <!-- Tarjetas de Resumen -->
    <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin:30px 0;">
        <div class="card" style="text-align:center;">
            <h3>📅 Total Citas</h3>
            <p style="font-size: 2em; font-weight: bold; margin: 10px 0;">{{ total_citas }}</p>
        </div>
        <div class="card" style="text-align:center;">
            <h3>🦷 Pacientes Registrados</h3>
            <p style="font-size: 2em; font-weight: bold; margin: 10px 0;">{{ total_pacientes }}</p>
        </div>
        <div class="card" style="text-align:center;">
            <h3>✅ Citas Completadas</h3>
            <p style="font-size: 2em; font-weight: bold; margin: 10px 0; color: #28a745;">{{ estados['Completada'] }}</p>
        </div>
    </div>

    <!-- Gráficos -->
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:30px; margin-top:40px;">
        <!-- Gráfico de Dona: Distribución por Estado -->
        <div class="card" style="padding: 20px;">
            <h3 style="text-align:center;">Distribución de Citas por Estado</h3>
            <canvas id="graficoEstados"></canvas>
        </div>

        <!-- Gráfico de Barras: Comparativo -->
        <div class="card" style="padding: 20px;">
            <h3 style="text-align:center;">Citas por Categoría</h3>
            <canvas id="graficoBarras"></canvas>
        </div>
    </div>

</main>

<script>
    // Datos pasados dinámicamente desde Flask
    const datosEstados = {
        pendientes: {{ estados['Pendiente'] }},
        confirmadas: {{ estados['Confirmada'] }},
        completadas: {{ estados['Completada'] }},
        canceladas: {{ estados['Cancelada'] }}
    };

    // Configuración Gráfico de Dona
    const ctxDona = document.getElementById('graficoEstados').getContext('2d');
    new Chart(ctxDona, {
        type: 'doughnut',
        data: {
            labels: ['Pendientes', 'Confirmadas', 'Completadas', 'Canceladas'],
            datasets: [{
                data: [
                    datosEstados.pendientes,
                    datosEstados.confirmadas,
                    datosEstados.completadas,
                    datosEstados.canceladas
                ],
                backgroundColor: ['#ffc107', '#0d6efd', '#198754', '#dc3545']
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'bottom' }
            }
        }
    });

    // Configuración Gráfico de Barras
    const ctxBarras = document.getElementById('graficoBarras').getContext('2d');
    new Chart(ctxBarras, {
        type: 'bar',
        data: {
            labels: ['Pendientes', 'Confirmadas', 'Completadas', 'Canceladas'],
            datasets: [{
                label: 'Cantidad de Citas',
                data: [
                    datosEstados.pendientes,
                    datosEstados.confirmadas,
                    datosEstados.completadas,
                    datosEstados.canceladas
                ],
                backgroundColor: ['#ffc107', '#0d6efd', '#198754', '#dc3545']
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: true, ticks: { stepSize: 1 } }
            },
            plugins: {
                legend: { display: false }
            }
        }
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubicación - Consultorio Odontológico</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='IMG/logoconsultorio.png') }}" alt="logotipo" class="logo">
            <h1>Consultorio Odontológico</h1>
        </div>
        <nav id="menuPrincipal">
            <a href="/">Inicio</a>
            <a href="/sobre_nosotros">Sobre Nosotros</a>
            <a href="/citas">Citas</a>
            <a href="/ubicacion">Ubicación</a>
            <a href="/contactenos">Contáctenos</a>

            {% if session.get('nombre') %}
                <div class="user-info">
                    <span class="user-name">👤 {{ session['nombre'] }}</span>
                </div>
                <a href="/logout" class="btn-logout">Cerrar Sesión</a>
            {% else %}
                <a href="/login" class="btn-login">Entrar</a>
                <a href="/register" class="btn-register">Registro</a>
            {% endif %}
        </nav>
    </header>

    <main style="padding: 20px; text-align: center;">
        <h2 style="color: #1E88E5; margin-bottom: 20px;">Ubicación - Calle 127 Edificio Pluss</h2>

        <iframe
            width="100%"
            height="500"
            style="border:0; border-radius: 12px;"
            loading="lazy"
            allowfullscreen
            src="https://www.google.com/maps?q=Calle+127+Edificio+Pluss+Bogota&output=embed">
        </iframe>
    </main>

    <!-- Botón Flotante Instagram -->
    <a href="https://www.instagram.com/invensibles_software" class="btn-instagram" target="_blank">
        <i class="fab fa-instagram"></i>
    </a>

    <!-- Menú Flotante WhatsApp -->
    <div class="whatsapp-menu-container">
        <div class="whatsapp-list" id="wa-list">
            <div class="wa-header">Contactar con un asesor</div>
            <a href="https://wa.me/573144760938" target="_blank" class="wa-item"><i class="fab fa-whatsapp"></i> <span>Asesor 1</span></a>
            <a href="https://wa.me/573104774044" target="_blank" class="wa-item"><i class="fab fa-whatsapp"></i> <span>Asesor 2</span></a>
            <a href="https://wa.me/573103592752" target="_blank" class="wa-item"><i class="fab fa-whatsapp"></i> <span>Asesor 3</span></a>
            <a href="https://wa.me/573108659353" target="_blank" class="wa-item"><i class="fab fa-whatsapp"></i> <span>Asesor 4</span></a>
        </div>
        <button class="btn-wa-main" onclick="toggleWAMenu()">
            <i class="fab fa-whatsapp"></i>
        </button>
    </div>

    <script src="{{ url_for('static', filename='js/menu.js') }}"></script>
    <script>
        function toggleWAMenu() {
            const list = document.getElementById("wa-list");
            if (list) {
                list.classList.toggle("active");
                list.classList.toggle("show");
            }
        }
    </script>
</body>
</html>

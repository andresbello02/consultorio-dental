<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultorio Odontológico</title>
    <link rel="stylesheet" href="../static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <div class="logo-container">
            <img src="../static/IMG/logoconsultorio.png" alt="logotipo" class="logo">
            <h1>Consultorio Odontológico</h1>
        </div>
<nav>
    <a href="/">Inicio</a>
    <a href="/sobre_nosotros">Sobre Nosotros</a>
    <a href="/citas">Citas</a>
    <a href="/ubicacion">Ubicación</a>
    <a href="/contactenos">Contáctenos</a>

    {% if session.get('nombre') %}
        <div class="user-info">
            <span class="user-name">👤 {{ session['nombre'] }}</span>
        </div>
        <a href="/logout" class="btn-logout">Cerrar Sesión</a>
    {% else %}
        <a href="/login" class="btn-login">Entrar</a>
        <a href="/register" class="btn-register">Registro</a>
    {% endif %}
</nav>
    </header>

    <script>
        // Lógica para el menú dinámico
        document.addEventListener("DOMContentLoaded", function() {
            const nav = document.getElementById("menuPrincipal");
            const rol = localStorage.getItem("rol");

            if (rol === "admin") {
                nav.innerHTML += '<a href="admin.html" class="btn-login">Panel Admin</a>';
                nav.innerHTML += '<a href="#" onclick="logout()" class="btn-register">Salir</a>';
            } else if (rol === "paciente") {
                nav.innerHTML += '<a href="#" onclick="logout()" class="btn-register">Salir</a>';
            } else {
                nav.innerHTML += '<a href="/login" class="btn-login">Login</a>';
                nav.innerHTML += '<a href="/register" class="btn-register">Register</a>';
            }
        });

        function logout() {
            localStorage.removeItem("rol");
            window.location.href = "/login";
        }

        function scrollForm() {
            document.getElementById('seccion-cita').scrollIntoView({behavior: 'smooth'});
        }
    </script>

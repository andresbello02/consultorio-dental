<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h3 class="mb-3 text-center">Recuperar Contraseña</h3>
                        <p class="text-muted text-center">Ingresa tu correo electrónico registrado y te enviaremos un enlace para restablecer tu clave.</p>

                        {% if mensaje %}
                            <div class="alert alert-success">{{ mensaje }}</div>
                        {% endif %}
                        {% if error %}
                            <div class="alert alert-danger">{{ error }}</div>
                        {% endif %}

                        <form action="{{ url_for('recuperar') }}" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Correo Electrónico</label>
                                <input type="email" name="email" class="form-control" placeholder="ejemplo@correo.com" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Enviar Enlace</button>
                        </form>
                        <div class="mt-3 text-center">
                            <a href="{{ url_for('login') }}" class="text-decoration-none text-muted">Cancelar y volver</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

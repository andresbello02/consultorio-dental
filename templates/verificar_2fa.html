<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticación en 2 Pasos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-4 text-center">
                        <h3 class="mb-3">Verificación de Seguridad</h3>
                        <p class="text-muted">Hemos enviado un código de 6 dígitos a tu correo electrónico. Ingrésalo a continuación para continuar.</p>
                        
                        {% if error %}
                            <div class="alert alert-danger">{{ error }}</div>
                        {% endif %}

                        <form action="{{ url_for('verificar_2fa') }}" method="POST">
                            <div class="mb-3">
                                <input type="text" name="codigo" class="form-control text-center fs-4 tracking-widest" placeholder="000000" maxlength="6" required autofocus>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Verificar Código</button>
                        </form>
                        <div class="mt-3">
                            <a href="{{ url_for('login') }}" class="text-decoration-none text-muted">Volver al inicio de sesión</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
